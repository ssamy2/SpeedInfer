# Default LoRA Fine-Tuning Configuration for Qwen2.5 / Llama 3
model_name_or_path: "Qwen/Qwen2.5-7B-Instruct"
dataset_path: "./data/training_sample.jsonl"
output_dir: "./output/qwen-lora-adapter"
eval_split_ratio: 0.10

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

training:
  learning_rate: 0.0002
  num_train_epochs: 3.0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  max_seq_length: 2048
  bf16: true
  fp16: false

mlflow:
  experiment_name: "speedinfer-qwen-finetuning"
  tracking_uri: "http://localhost:5000"
  registered_model_name: "SpeedInfer-Qwen2.5-7B-Instruct-Custom"
  tags:
    platform: "SpeedInfer"
    accelerator: "NVIDIA-A100"
