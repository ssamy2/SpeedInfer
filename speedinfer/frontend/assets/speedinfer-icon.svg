<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbf73e"/>
      <stop offset="50%" stop-color="#8ce82b"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(203,247,62,0.18)" stroke-width="4"/>
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- SpeedInfer Lightning / Double-Chevron Core -->
  <g filter="url(#glow)">
    <path d="M120 136 h300 L268 256 H92 l148 120 h152" 
          fill="none" 
          stroke="url(#bolt-grad)" 
          stroke-width="46" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>