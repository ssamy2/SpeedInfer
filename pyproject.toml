[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "speedinfer"
version = "0.1.0"
description = "High-performance OpenAI-compatible TensorRT-LLM inference engine and developer platform"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "fakeredis>=2.26,<3",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.8,<3",
  "psycopg2-binary>=2.9,<3",
  "sqlmodel>=0.0.22,<1",
  "structlog>=24.4,<26",
  "redis>=5.2,<7",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis[lua]>=2.26,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
training = [
  "datasets>=3.1,<4",
  "mlflow>=2.18,<3",
  "peft>=0.14,<1",
  "pyyaml>=6.0,<7",
  "transformers>=4.46,<5",
  "trl>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["speedinfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
