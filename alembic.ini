# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = migrations

# Prepend sys.path with current directory so speedinfer module is importable
prepend_sys_path = .

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Version location specification; this defaults to migrations/versions.
version_locations = %(here)s/migrations/versions

# Version path separator; defaults to os.pathsep
version_path_separator = os

# The database URL is dynamically overridden in migrations/env.py
# using speedinfer.config.get_settings().database_url.
# Default fallback shown below:
sqlalchemy.url = sqlite:///./data/speedinfer.db

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
