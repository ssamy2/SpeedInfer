<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="780" height="180">
  <defs>
    <linearGradient id="bolt-grad-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbf73e"/>
      <stop offset="50%" stop-color="#8ce82b"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <filter id="glow-h" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Icon squircle -->
  <rect x="16" y="20" width="140" height="140" rx="36" fill="url(#icon-bg)" stroke="rgba(203,247,62,0.22)" stroke-width="2.5"/>
  <!-- Icon bolt -->
  <path d="M48 58 h76 L94 90 H50 l38 32 h38" 
        fill="none" 
        stroke="url(#bolt-grad-h)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow-h)"/>
  <!-- Typography SpeedInfer -->
  <text x="180" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="76" fill="#ffffff" letter-spacing="-1.5">SpeedInfer</text>
  <!-- Dot / Accent period -->
  <text x="578" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="84" fill="#cbf73e">.</text>
  <!-- Tagline -->
  <text x="184" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="18" fill="#8da0b8" letter-spacing="2.8">HIGH-PERFORMANCE INFERENCE PLATFORM</text>
</svg>